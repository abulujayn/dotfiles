[theme]
mode = "dark"
source = "builtin"
builtin = "Nord"

[wallpaper]
directory = "~/.config/wallpapers"

[shell]
time_format = "{:%R}" # 24-hour time
polkit_agent = true

[shell.animation]
enabled = false

[shell.greeter_sync]
auto_sync = true

[lockscreen]
fingerprint = true

[location]
address = "Canberra, Australia"
